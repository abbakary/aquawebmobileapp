name: mobileapp
description: "AquaCatch FishTrade ERP - Tanzania Lake Victoria Fish Trading Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local Storage / Offline
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.68.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Network
  http: ^1.2.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
